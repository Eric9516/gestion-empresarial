# Verificación automática: en cada cambio subido a GitHub revisa que el código compile,
# pase el lint y pase las pruebas. No publica nada.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm pruebas:esquema
      - run: pnpm pruebas:escala
      - run: pnpm pruebas:concurrencia
      - run: pnpm pruebas:busqueda
      - run: pnpm pruebas:supabase-local
      - run: pnpm build

  # Pruebas de pantalla: abre la app en un navegador de verdad, contra el Supabase local de pruebas, y hace lo que haría una persona (entrar, retirar, recibir...).
  # También revisa la accesibilidad de cada pantalla con axe. Si algo falla, se guardan capturas y el registro de lo que pasó para verlo.
  pantalla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm pruebas:pantalla
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-de-las-pruebas-de-pantalla
          path: test-results
          retention-days: 7

  # El panel de administración de clientes (carpeta panel/) tiene sus propias dependencias y sus propias pruebas de ataque.
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm run build
